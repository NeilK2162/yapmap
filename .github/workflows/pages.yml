# Publishes the demo gallery to GitHub Pages on every push to main.
# The site is the app itself with no server: index.html + static/ + demo/.
# The frontend notices there's no /api and reads demo/ instead.
name: Deploy demo gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp templates/index.html _site/index.html
          # mark the page as the static build, so it reads demo/ without probing for /api
          sed -i 's/<html lang="en"/<html lang="en" data-static="1"/' _site/index.html
          cp -r static _site/static
          cp -r demo _site/demo
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
