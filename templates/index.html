<script>
  // Theme before first paint, so light-mode users never see a dark flash.
  (function () {
    var pref = null;
    try { pref = localStorage.getItem('yapmap.theme'); } catch (e) {}
    var light = pref ? pref === 'light'
      : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  })();
</script>
